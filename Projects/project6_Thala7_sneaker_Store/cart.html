<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thala 7 – Cart</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar container flex space-between">
    <div class="logo">Thala 7</div>
    <ul class="flex">
      <li><a href="index.html">Home</a></li>
      <li><a href="product.html">Products</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <div class="actions flex">
      <button class="icon-btn" aria-label="search">🔍</button>
      <a href="cart.html" class="icon-btn" aria-label="cart">🛒</a>
      <img class="profile-img" src="https://randomuser.me/api/portraits/men/75.jpg" alt="profile photo">
    </div>
  </header>

  <section class="cart-grid container">
    <!-- Left: table -->
    <div>
      <h2>Shopping Cart</h2>
      <table class="cart-table">
        <thead>
          <tr><th>Product</th><th>Qty</th><th>Price</th><th></th></tr>
        </thead>
        <tbody>
          <tr>
            <td class="flex" style="gap:0.75rem;align-items:center;">
              <img src="./images/main.avif?auto=format&fit=crop&w=100&q=60" alt="AirFlex Runner">
              AirFlex Runner
            </td>
            <td>1</td>
            <td>₹8,499</td>
            <td><button class="icon-btn" aria-label="remove">❌</button></td>
          </tr>
        </tbody>
      </table>
      <p style="margin-top:1rem;"><a href="index.html">← Continue Shopping</a></p>
    </div>

    <!-- Right: summary -->
    <div class="summary-card">
      <h3>Order Summary</h3>
      <div style="margin-block:1rem;">
        <label for="coupon">Coupon code</label>
        <div class="flex" style="gap:0.5rem;">
          <input id="coupon" type="text" placeholder="SUMMER25" style="flex:1; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--clr-light);">
          <button class="btn" style="padding:0.6rem 1rem; font-size:0.9rem;">Apply</button>
        </div>
      </div>
      <div class="summary-row"><span>Subtotal</span><span>₹8,499</span></div>
      <div class="summary-row"><span>Taxes (18%)</span><span>₹1,529.8</span></div>
      <div class="summary-row"><span>Discount</span><span>-₹0</span></div>
      <div class="summary-row total"><span>Total</span><span>₹10,029</span></div>
      <button class="btn" style="width:100%; margin-top:1.2rem;" onclick="location.href='checkout.html'">Pay Now</button>
      <p style="margin-top:0.8rem; text-align:center; font-size:0.8rem;">Powered by <strong>Razorpay</strong></p>
    </div>
  </section>
</body>
</html>
