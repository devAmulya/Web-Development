<!-- =====================
     index.html  (Landing Page)
     ===================== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thala 7 Sneaker Store – Home</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar container flex space-between">
    <div class="logo">Thala 7</div>
    <ul class="flex">
      <li><a href="#">Home</a></li>
      <li><a href="product.html">Products</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <div class="actions flex">
      <button class="icon-btn" aria-label="search">🔍</button>
      <a href="cart.html" class="icon-btn" aria-label="cart">🛒</a>
      <img class="profile-img" src="https://randomuser.me/api/portraits/men/75.jpg" alt="profile photo">
    </div>
  </header>

  <!-- Hero -->
  <section class="hero container">
    <div class="hero-content">
      <h1>Step Into <span style="color:var(--clr-accent);">Comfort</span> & Style</h1>
      <p>Discover the latest drop of signature sneakers engineered for performance and designed for streetwear vibes.</p>
      <a href="product.html" class="btn">Shop Now</a>
    </div>
    <div class="hero-img">
      <img src="./images/main.avif"  alt="Sneaker on gradient background">
    </div>
  </section>

  <!-- Service overview -->
  <section class="stats">
    <div><span>2k+</span>Reviews</div>
    <div><span>30k+</span>Customers</div>
    <div><span>4.5/5</span>Rating</div>
    <div><span>HQ</span>High Quality</div>
  </section>
</body>
</html>
