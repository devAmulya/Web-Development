<!-- =====================

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thala 7 – Checkout</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar container flex space-between">
    <div class="logo">Thala 7</div>
    <ul class="flex">
      <li><a href="index.html">Home</a></li>
      <li><a href="product.html">Products</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <div class="actions flex">
      <button class="icon-btn" aria-label="search">🔍</button>
      <a href="cart.html" class="icon-btn" aria-label="cart">🛒</a>
      <img class="profile-img" src="https://randomuser.me/api/portraits/men/75.jpg" alt="profile photo">
    </div>
  </header>

  <section class="checkout-grid container">
    <!-- Left: payment form -->
    <div>
      <h2>Checkout</h2>
      <form class="payment-card">
        <label for="email">Email ID</label>
        <input id="email" type="email" required placeholder="you@example.com">

        <div class="payment-methods" style="margin-top:1.25rem;">
          <button type="button" class="active">Card</button>
          <button type="button">UPI</button>
          <button type="button">Net Banking</button>
          <button type="button">Crypto</button>
        </div>

        <label for="card">Card Number</label>
        <input id="card" type="text" placeholder="1234 5678 9012 3456" maxlength="19">

        <div class="flex" style="gap:1rem;">
          <div style="flex:1;">
            <label for="exp">Expiry MM/YY</label>
            <input id="exp" type="text" placeholder="08/29" maxlength="5">
          </div>
          <div style="flex:1;">
            <label for="cvv">CVV</label>
            <input id="cvv" type="password" placeholder="123" maxlength="4">
          </div>
        </div>

        <label for="country">Country</label>
        <input id="country" type="text" placeholder="India">

        <label for="zip">Zip Code</label>
        <input id="zip" type="text" placeholder="560001">
      </form>
    </div>

    <!-- Right: summary -->
    <div class="summary-card">
      <h3>Order Summary</h3>
      <div style="margin-block:1rem;">
        <label for="coupon2">Coupon code</label>
        <div class="flex" style="gap:0.5rem;">
          <input id="coupon2" type="text" placeholder="SUMMER25" style="flex:1; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--clr-light);">
          <button class="btn" style="padding:0.6rem 1rem; font-size:0.9rem;">Apply</button>
        </div>
      </div>
      <div class="summary-row"><span>Subtotal</span><span>₹8,499</span></div>
      <div class="summary-row"><span>Taxes (18%)</span><span>₹1,529.8</span></div>
      <div class="summary-row"><span>Discount</span><span>-₹0</span></div>
      <div class="summary-row total"><span>Total</span><span>₹10,029</span></div>
      <button class="btn" style="width:100%; margin-top:1.2rem;">Pay Now</button>
      <p style="margin-top:0.8rem; text-align:center; font-size:0.8rem;">Transactions secured by <strong>Razorpay</strong></p>
    </div>
  </section>
</body>
</html>
