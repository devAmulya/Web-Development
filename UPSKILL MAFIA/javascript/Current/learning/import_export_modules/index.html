<!-- Today Learning : 
#We can export data , functions etc
1) Exporting a function : use keyword export before function
2) Importing a function : use keyword import like : import {function_name} from "relative_address";
3) import statement work inside module only 
4) to configure a js file into module, add script attribute type ="module" while linking html to js using script
5) We can give alias to function importing using "as" inside function_name
6) we can export multiple function in one time by : export{ function1, function2 as f2};
7) We can give alias in this method while exporting
8) We can import all exports of a file by using * : import * as utility from 'relative address'
9) Need to give alias as it is important , function use : utility.mul()
10) we can import without curly braces(default import) by using 'default'
11) add default keyword after export (only one in a file)
