5) We passes an arrow anonymous function as paramenter to promise
6) Default parameters name. Use them to tell state with some value
7) return/output : resolve : any value Ex: resolve(100)
8) for : error - reject(new Error("Error Name"))); to throw an error or msg : directly like resolve
9) return statement doesnot work
