<!-- Todays Learning 
1) Variable - name of any memory location/address
2) Uses let and const keywords to define variable - block scoped (btw {} only)
3) var - not used now(function scoped or global scoped + redeclaration)
4) let - no redeclaration , have reinitialization
5) Dynamically type language - var can be initialized with multiple type of values
6) const - no redeclaration , no reinitialization(ignored), initialization with declaration
7) Variable Convention - no reserved keywords, no space, CamelCase(nameOfTopper), start with _ , $ ,or character(no number at start)
8) Datatypes - primitive and non primitive
9) primitive dt - number(-2^53 -1 to +2^53 -1 ), string, boolean, undefined, NULL, BigInt(bigger than number), Symbol
10) infintie(larger than 1.79 * 10^308), NaN
11) Symbol - unique value(avoid name conflict) and two sym with same value are not equal, used in object identifier case. They are not shown (little private)
12) Conversion : Number(), String(), Boolean()
13) Value except 0 is true(boolean value : 1)
14) typeof()  -->
