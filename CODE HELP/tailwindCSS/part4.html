<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <nav class="bg-deepBlue">

    <div class="relative mx-auto flex max-w-[1080px] w-full items-center justify-between">

      <!-- Logo -->

      <a href="/" class="cursor-pointer py-7 pr-7">
        <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/razorpay-icon.png" width="125px" height="30px" class="bg-white" alt="Logo" />
      </a>

      <ul class="flex space-x-6">

        <li class="group relative cursor-pointer py-7 font-mullish text-white transition-all duration-200 hover:text-lightBlue ">
          <a href="#">Payments</a>
          <div class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block" ></div>
        </li>

        <li class="group relative cursor-pointer py-7 font-mullish text-white transition-all duration-200 hover:text-lightBlue ">
          <a href="#">Banking</a>
          <div class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block" ></div>
        </li>

        <li class="group relative cursor-pointer py-7 font-mullish text-white transition-all duration-200 hover:text-lightBlue ">
          <a href="#">Corporate Card</a>
          <div class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block" ></div>
        </li>

        <li class="group relative cursor-pointer py-7 font-mullish text-white transition-all duration-200 hover:text-lightBlue ">
          <a href="#">Payroll</a>
          <div class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block" ></div>
        </li>

        <li class="group relative cursor-pointer py-7 font-mullish text-white transition-all duration-200 hover:text-lightBlue ">
          <a href="#">Resources</a>
          <div class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block" ></div>
        </li>

        <li class="group relative cursor-pointer py-7 font-mullish text-white transition-all duration-200 hover:text-lightBlue ">
          <a href="#">Support</a>
          <div class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block" ></div>
        </li>

        <li class="group relative cursor-pointer py-7 font-mullish text-white transition-all duration-200 hover:text-lightBlue ">
          <a href="#">Pricing</a>
          <div class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block" ></div>
        </li>

      </ul>

      <div class="flex space-x-6">
        <img src="https://cdn-icons-png.freepik.com/256/4786/4786928.png?semt=ais_white_label" height="30px" width="28px" />

        <button class="py-3 px-5 font-mullish text-white border-lightBlue border rounded-sm text-sm font-bold">Log in</button>

        <button class="py-3 px-4 font-mullish rounded-sm text-sm font-bold bg-white text-lightBlue300 border transition-all duration-200 hover:text-lightBlue500">Sign Up</button>
      </div>

    </div>
  </nav>
</body>
</html>


<!-- Learning : 
1) We can add custom classes using extend in config.js file -->
